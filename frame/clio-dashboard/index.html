    <script>
      // One theme for the site and every component in it: the library's own key.
      // A first visit follows the system; dark is stored so components that apply
      // the stored theme on mount agree with it.
      try {
        var t = localStorage.getItem("zeus:theme");
        if (!t && matchMedia("(prefers-color-scheme: dark)").matches) localStorage.setItem("zeus:theme", (t = "dark"));
        if (t === "dark") {
          document.documentElement.classList.add("dark");
          document.documentElement.style.colorScheme = "dark";
        }
      } catch (e) {}
    </script>
