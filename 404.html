<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Zeus UI — Back soon</title>
<meta name="description" content="Zeus UI is down for maintenance and will be back soon.">
<style>
:root { color-scheme: light dark; --paper: #fcfdff; --ink: #172138; --muted: #596579; --line: #dfe5ef; --blue: #2855e8; }
@media (prefers-color-scheme: dark) { :root { --paper: #0b0d12; --ink: #f4f6fa; --muted: #8d96a8; --line: #262b36; --blue: #a0baff; } }
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { display: grid; place-items: center; padding: 24px; background: var(--paper); color: var(--ink); font: 16px/1.6 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Inter, sans-serif; }
main { max-width: 460px; text-align: center; }
.brand { display: inline-flex; align-items: center; gap: 10px; font-size: 19px; font-weight: 600; letter-spacing: -0.02em; }
.brand svg { color: var(--blue); }
h1 { margin: 28px 0 0; font-size: clamp(30px, 6vw, 40px); line-height: 1.12; font-weight: 600; letter-spacing: -0.03em; }
p { margin: 14px 0 0; color: var(--muted); }
.status { display: inline-flex; align-items: center; gap: 8px; margin-top: 26px; padding: 6px 12px; border: 1px solid var(--line); border-radius: 999px; font-size: 13px; color: var(--muted); }
.status i { width: 8px; height: 8px; border-radius: 50%; background: #f5a524; animation: pulse 1.6s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: 0.35; } }
@media (prefers-reduced-motion: reduce) { .status i { animation: none; } }
</style>
</head>
<body>
<main>
  <span class="brand">
    <svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="8" height="11" rx="2" fill="currentColor"/><rect x="13" y="3" width="8" height="6" rx="2" fill="currentColor"/><rect x="3" y="16" width="8" height="5" rx="2" fill="currentColor"/><rect x="13" y="11" width="8" height="10" rx="2" fill="currentColor"/></svg>
    Zeus UI
  </span>
  <h1>We&rsquo;ll be back soon.</h1>
  <p>Zeus UI is down for maintenance while we make some changes. Please check back shortly.</p>
  <span class="status"><i></i> Maintenance in progress</span>
</main>
</body>
</html>
